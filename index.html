<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>my farm</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#F3ECDD;color:#3B3324;padding-bottom:70px}
button{font-family:'Tajawal',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Tajawal',sans-serif}
#nav{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #E1D6BB;display:flex;z-index:100;height:56px}
#nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#8C8064}
#nav button.active{color:#6E7B45;font-weight:700}
#nav button .ico{font-size:20px}
#content{padding-top:64px}
.page{display:none;padding:14px}
.page.active{display:block}
.card{background:#fff;border:1px solid #E1D6BB;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sc{background:#fff;border:1px solid #E1D6BB;border-radius:12px;padding:12px;flex:1;min-width:90px}
.sc .v{font-size:24px;font-weight:700}
.sc .l{font-size:11px;color:#8C8064;margin-top:2px}
.sc .s{font-size:11px;margin-top:2px}
.btn{background:#6E7B45;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-g{background:none;border:1px solid #E1D6BB;color:#3B3324;border-radius:10px;padding:8px 12px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.btn-r{background:none;border:1px solid #A8503A55;color:#A8503A;border-radius:10px;padding:8px 12px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.bi{background:none;border:none;color:#8C8064;padding:5px;font-size:16px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8C8064;margin-bottom:10px}
.fld input,.fld select,.fld textarea{background:#F3ECDD;border:1px solid #E1D6BB;color:#3B3324;border-radius:10px;padding:9px 11px;font-size:13px;width:100%}
.fld textarea{min-height:58px;resize:vertical}
#ovl{position:fixed;inset:0;background:rgba(59,51,36,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#ovl.open{display:flex}
.mdl{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:18px;max-height:88vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h3{font-size:16px}
.ib{display:flex;flex-wrap:wrap;gap:8px;background:#EBE1CB;border-radius:14px;padding:12px}
.ibtn{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:65px;background:none;border:none;padding:4px}
.iw{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.in{font-size:15px;font-weight:700}
.il{font-size:10px;color:#8C8064;text-align:center}
.tb{display:inline-flex;align-items:center;gap:5px;background:#EBE1CB;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:700}
.td{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.cp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cd{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:13px}
.cd.sel{border-color:#6E7B45;box-shadow:0 0 0 2px #fff,0 0 0 3px #6E7B45}
.li{display:flex;justify-content:space-between;align-items:center;background:#F3ECDD;border:1px solid #E1D6BB;border-radius:10px;padding:9px 11px;margin-bottom:8px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.st{font-weight:700;font-size:14px}
#tst{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#3B3324;color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;display:none;z-index:300;white-space:nowrap;max-width:90vw;text-align:center}
#tst.err{background:#A8503A}
.chip{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.cg{background:#6E7B4520;color:#6E7B45;border:1px solid #6E7B4544}
.cr{background:#A8503A20;color:#A8503A;border:1px solid #A8503A44}
.cau{background:#C79A3E20;color:#C79A3E;border:1px solid #C79A3E44}
.empty{text-align:center;padding:28px 14px;color:#8C8064;background:#fff;border:1px dashed #E1D6BB;border-radius:14px;font-size:13px}
.bar{height:7px;border-radius:4px;background:#E1D6BB;overflow:hidden;margin-top:3px}
.bf{height:100%;border-radius:4px}
.db{background:#F3ECDD;border-radius:10px;padding:11px;margin-top:8px}
.flex{display:flex}.fw{display:flex;flex-wrap:wrap}.gap8{gap:8px}.gap10{gap:10px}.jb{justify-content:space-between}.ac{align-items:center}.w100{width:100%}.jc{justify-content:center}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}
.red{color:#A8503A}.green{color:#6E7B45}.gold{color:#C79A3E}.muted{color:#8C8064}
</style>
</head>
<body>
<div id="nav">
  <button class="active" onclick="nav('home')"><span class="ico">🏠</span><span>الرئيسية</span></button>
  <button onclick="nav('pens')"><span class="ico">🧱</span><span>الحظائر</span></button>
  <button onclick="nav('fin')"><span class="ico">💰</span><span>المالية</span></button>
  <button onclick="nav('rep')"><span class="ico">📊</span><span>التقارير</span></button>
</div>
<div id="content">

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="flex jb ac mb10">
    <div><div style="font-size:21px;font-weight:700">my farm</div><div class="muted" style="font-size:11px">إدارة القطيع</div></div>
    <div class="flex gap8 ac">
      <button class="bi" onclick="openNotes()" style="font-size:22px;position:relative">📓<span id="nb" style="display:none;position:absolute;top:-3px;right:-3px;background:#6E7B45;color:#fff;font-size:9px;font-weight:700;border-radius:999px;min-width:15px;height:15px;align-items:center;justify-content:center"></span></button>
      <button class="bi" onclick="openVax()" style="font-size:22px;position:relative">💉<span id="vb" style="display:none;position:absolute;top:-3px;right:-3px;background:#4472A8;color:#fff;font-size:9px;font-weight:700;border-radius:999px;min-width:15px;height:15px;align-items:center;justify-content:center"></span></button>
      <button class="bi" onclick="togBell()" style="font-size:22px;position:relative">🔔<span id="ab" style="display:none;position:absolute;top:-3px;right:-3px;background:#A8503A;color:#fff;font-size:9px;font-weight:700;border-radius:999px;min-width:15px;height:15px;align-items:center;justify-content:center;padding:0 2px"></span></button>
    </div>
  </div>
  <div id="bell-dd" style="display:none" class="card mb10"><div id="bell-list"></div></div>
  <div class="row" id="h-stats"></div>
  <div class="row" id="h-twin"></div>
  <div class="card mb10">
    <div class="st mb10">إضافة حلال</div>
    <div class="fld"><input type="text" id="nn" placeholder="الرقم"></div>
    <div class="cp" id="ncp"></div>
    <div class="fld" id="np-fld" style="display:none"><select id="np-sel"><option value="">بدون حظيرة</option></select></div>
    <button class="btn" onclick="addAnimal()">＋ إضافة</button>
    <div id="ae" class="red mt8" style="font-size:12px;display:none"></div>
  </div>
  <div class="card mb10">
    <div class="st mb8">🔍 البحث</div>
    <div class="flex gap8 fw">
      <input type="text" id="sn" placeholder="الرقم" oninput="doSearch()" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:10px;padding:9px 11px;font-size:13px;flex:1;min-width:100px">
      <select id="sc" onchange="doSearch()" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:10px;padding:9px 11px;font-size:13px;flex:1;min-width:100px"><option value="">الكل</option></select>
    </div>
    <div id="sr" class="mt8"></div>
  </div>
  <div class="ib" id="ibar"></div>
</div>

<!-- PENS -->
<div id="page-pens" class="page">
  <div class="sh"><span class="st">الحظائر</span><button class="btn" onclick="openAddPen()">＋ جديدة</button></div>
  <div id="pens-list"></div>
</div>

<!-- FINANCE -->
<div id="page-fin" class="page">
  <div class="sh"><span class="st">المالية</span><button class="btn-r" onclick="cfmResetFin()">📅 سنة جديدة</button></div>
  <div class="card mb10" style="text-align:center"><div class="muted" style="font-size:11px">الصافي</div><div id="fnet" style="font-size:30px;font-weight:700"></div></div>
  <div class="row" id="ftotals"></div>
  <div style="background:#EBE1CB;border-radius:12px;padding:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <span class="muted" style="font-size:11px">📅</span>
    <input type="date" id="ff" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:6px 8px;font-size:12px;flex:1;min-width:110px" onchange="rFin()">
    <span class="muted" style="font-size:11px">إلى</span>
    <input type="date" id="ft" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:6px 8px;font-size:12px;flex:1;min-width:110px" onchange="rFin()">
    <button class="bi" onclick="document.getElementById('ff').value='';document.getElementById('ft').value='';rFin()">✕</button>
  </div>
  <div class="sh">
    <span class="st">المصروفات</span>
    <div class="flex gap8 ac">
      <select id="ecf" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:5px 8px;font-size:11px" onchange="rFin()"><option value="">الكل</option><option>حلال</option><option>مكعب</option><option>حشائش</option><option>أدوية</option><option>فيتامينات</option><option>ماء</option><option>رواتب</option><option>صيانة</option><option>بنزين</option><option>إيجار</option><option>تطعيمات</option><option>أخرى</option></select>
      <button class="btn-g" onclick="openExpModal()">＋ مصروف</button>
    </div>
  </div>
  <div id="exp-list" class="mb10"></div>
  <div class="sh">
    <span class="st">المبيعات</span>
    <div class="flex gap8 ac">
      <input type="text" id="ssrch" placeholder="بحث..." style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:5px 8px;font-size:11px;width:80px" oninput="rFin()">
      <button class="btn-g" onclick="openSaleModal()">＋ مبيعة</button>
    </div>
  </div>
  <div id="sal-list"></div>
</div>

<!-- REPORTS -->
<div id="page-rep" class="page">
  <div class="st mb10">📊 التقارير</div>
  <div style="background:#EBE1CB;border-radius:12px;padding:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <input type="date" id="rf" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:6px 8px;font-size:12px;flex:1;min-width:110px" onchange="rRep()">
    <span class="muted" style="font-size:11px">إلى</span>
    <input type="date" id="rt" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:6px 8px;font-size:12px;flex:1;min-width:110px" onchange="rRep()">
  </div>
  <div class="row" id="rtotals"></div>
  <div class="card mb10">
    <div class="sh"><span class="st">عداد الولادات</span><button class="btn-r" onclick="cfmResetBC()">🗑 تصفير</button></div>
    <div class="row" id="rbc"></div>
  </div>
  <div class="card mb10"><div class="st mb10">إحصائيات القطيع</div><div class="row" id="rherd"></div></div>
  <div class="card mb10">
    <div class="st mb8">🔍 مصروف حسب النوع</div>
    <select id="rcat" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:8px;font-size:13px;width:100%" onchange="rRep()"><option value="">الكل</option><option>حلال</option><option>مكعب</option><option>حشائش</option><option>أدوية</option><option>فيتامينات</option><option>ماء</option><option>رواتب</option><option>صيانة</option><option>بنزين</option><option>إيجار</option><option>تطعيمات</option><option>أخرى</option></select>
    <div id="rcatr" class="mt8"></div>
  </div>
  <div class="card mb10"><div class="st mb8">مقارنة شهرية</div><div id="rmonth"></div></div>
  <div class="card mb10"><div class="st mb8">مواعيد التطعيم</div><div id="rvax"></div></div>
  <div class="card"><div class="st mb8">ملخص الحظائر</div><div id="rpens"></div></div>
</div>
</div>

<div id="ovl" onclick="closeMdl()"><div class="mdl" onclick="event.stopPropagation()" id="mbox"></div></div>
<div id="tst"></div>

<script>
const COLORS=[{v:'أحمر',h:'#C0392B'},{v:'أزرق',h:'#2E6E9E'},{v:'أصفر',h:'#D4B106'},{v:'أخضر',h:'#4C7A3D'},{v:'برتقالي',h:'#CC7A2E'},{v:'أبيض',h:'#F5F1E6'},{v:'أسود',h:'#2B2620'},{v:'وردي',h:'#C97B9C'},{v:'بنفسجي',h:'#7A5FA0'}];
const ECATS=['حلال','مكعب','حشائش','أدوية','فيتامينات','ماء','رواتب','صيانة','بنزين','إيجار','تطعيمات','أخرى'];
const KEY='myFarm_v3';
function seed(){return{animals:[],pens:[],expenses:[],sales:[],notes:[],vax:[],bc:{t:[],s:[]}};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.animals)){const d=seed();return Object.assign(d,p,{notes:p.notes||[],vax:p.vax||[],bc:p.bc&&Array.isArray(p.bc.t)?p.bc:{t:[],s:[]}});}}}catch(e){}return seed();}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
let db=load();
let selColor=COLORS[0].v;
let curAnimal=null;
let penSelMode=false,penSel=[];

function uid(){return Math.random().toString(36).slice(2,9);}
function tod(){return new Date().toISOString().slice(0,10);}
function fmt(s){if(!s)return'—';return new Date(s).toLocaleDateString('ar',{day:'numeric',month:'short',year:'numeric'});}
function hex(c){const t=COLORS.find(x=>x.v===c);return t?t.h:'#8C8064';}
function tbadge(n,c){const h=hex(c);return`<span class="tb"><span class="td" style="background:${h};${c==='أبيض'?'border:1px solid #ccc':''}"></span>#${n}</span>`;}
function toast(m,e){const t=document.getElementById('tst');t.textContent=(e?'✕ ':'✓ ')+m;t.className=e?'err':'';t.style.display='block';setTimeout(()=>t.style.display='none',2500);}

function nav(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const idx={home:0,pens:1,fin:2,rep:3}[id];
  document.querySelectorAll('#nav button')[idx].classList.add('active');
  if(id==='home')rHome();
  if(id==='pens')rPens();
  if(id==='fin')rFin();
  if(id==='rep')rRep();
}

function mkCP(cid,init,cb){
  const c=document.getElementById(cid);if(!c)return;
  c.innerHTML='';
  COLORS.forEach(t=>{
    const d=document.createElement('div');
    d.className='cd'+(t.v===init?' sel':'');
    d.style.background=t.h;
    if(t.v==='أبيض')d.style.border='2px solid #ccc';
    d.title=t.v;
    if(t.v===init)d.innerHTML='<span style="color:'+(t.v==='أبيض'||t.v==='أصفر'?'#333':'#fff')+'">✓</span>';
    d.onclick=()=>{c.querySelectorAll('.cd').forEach(x=>{x.classList.remove('sel');x.innerHTML='';});d.classList.add('sel');d.innerHTML='<span style="color:'+(t.v==='أبيض'||t.v==='أصفر'?'#333':'#fff')+'">✓</span>';if(cb)cb(t.v);};
    c.appendChild(d);
  });
}

function getAlerts(){
  const list=[];const now=new Date();
  db.animals.forEach(a=>{
    if(!a.alive)return;
    if(a.penId){const pen=db.pens.find(p=>p.id===a.penId);if(pen&&pen.alert!==false&&pen.days&&a.entered){const d=Math.floor((now-new Date(a.entered))/86400000);if(d>=pen.days)list.push({id:'p'+a.id,animalId:a.id,txt:`#${a.number} (${a.color}) في "${pen.name}" منذ ${d} يوم`});}}
  });
  db.vax.forEach(v=>{
    if(!v.date)return;
    const from=new Date(v.date);from.setDate(from.getDate()-(v.before||0));
    if(now>=from){const due=new Date(v.date)<=now;list.push({id:'v'+v.id,txt:`تطعيم "${v.type}" ${due?'مستحق':'قادم – '+fmt(v.date)}`});}
  });
  return list;
}

function rHome(){
  const A=db.animals;
  const mothers=A.filter(a=>a.cat==='m'&&a.alive);
  const newborns=A.filter(a=>a.cat==='n'&&a.alive);
  const dead=A.filter(a=>!a.alive);
  const prod=mothers.filter(m=>A.some(o=>o.motherId===m.id&&o.cat==='n'));
  const nonprod=mothers.filter(m=>!A.some(o=>o.motherId===m.id&&o.cat==='n'));
  const twin=mothers.filter(m=>m.twin);
  const tpct=prod.length?Math.round(twin.length/prod.length*100):0;
  const unassigned=A.filter(a=>a.alive&&!a.penId);
  const males=newborns.filter(n=>n.gender==='ذكر').length;
  const females=newborns.filter(n=>n.gender==='أنثى').length;
  const alerts=getAlerts();

  document.getElementById('h-stats').innerHTML=`
    <div class="sc"><div class="v green">${mothers.length}</div><div class="l">الأمهات</div></div>
    <div class="sc"><div class="v" style="color:#4472A8">${newborns.length}</div><div class="l">المواليد</div><div class="s muted">${females} إناث · ${males} ذكور</div></div>
    <div class="sc"><div class="v red">${dead.length}</div><div class="l">النفوق</div></div>
  `;
  document.getElementById('h-twin').innerHTML=`<div class="sc"><div class="v gold">${twin.length}</div><div class="l">المتأومة</div><div class="s gold">${tpct}% من المنتجة</div></div>`;

  const ab=document.getElementById('ab');ab.textContent=alerts.length;ab.style.display=alerts.length?'flex':'none';
  const nb=document.getElementById('nb');nb.textContent=db.notes.length;nb.style.display=db.notes.length?'flex':'none';
  const vb=document.getElementById('vb');vb.textContent=db.vax.length;vb.style.display=db.vax.length?'flex':'none';

  const ps=document.getElementById('np-sel');
  ps.innerHTML='<option value="">بدون حظيرة</option>'+db.pens.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  document.getElementById('np-fld').style.display=db.pens.length?'block':'none';

  mkCP('ncp',selColor,c=>selColor=c);

  const sc=document.getElementById('sc');
  sc.innerHTML='<option value="">الكل</option>'+COLORS.map(t=>`<option>${t.v}</option>`).join('');

  document.getElementById('ibar').innerHTML=`
    <button class="ibtn" onclick="showCatMdl('المنتجة',${JSON.stringify(prod.map(a=>a.id))},true)"><div class="iw" style="background:#6E7B4518">❤️</div><div class="in">${prod.length}</div><div class="il">منتجة</div></button>
    <button class="ibtn" onclick="showCatMdl('غير منتجة',${JSON.stringify(nonprod.map(a=>a.id))},true)"><div class="iw" style="background:#8C806418">❤️</div><div class="in">${nonprod.length}</div><div class="il">غير منتجة</div></button>
    <button class="ibtn" onclick="showCatMdl('المتأومة',${JSON.stringify(twin.map(a=>a.id))},false)"><div class="iw" style="background:#C79A3E18">👶</div><div class="in">${twin.length}</div><div class="il">متأومة</div></button>
    <button class="ibtn" onclick="showDeadMdl()"><div class="iw" style="background:#A8503A18">💀</div><div class="in">${dead.length}</div><div class="il">النفوق</div></button>
    <button class="ibtn" onclick="showCatMdl('بدون حظيرة',${JSON.stringify(unassigned.map(a=>a.id))},false)"><div class="iw" style="background:#4472A818">🧱</div><div class="in">${unassigned.length}</div><div class="il">بدون حظيرة</div></button>
  `;
}

function togBell(){
  const d=document.getElementById('bell-dd');
  d.style.display=d.style.display==='none'?'block':'none';
  const alerts=getAlerts();
  document.getElementById('bell-list').innerHTML=alerts.length===0?'<div class="muted" style="padding:12px;text-align:center;font-size:12px">لا توجد تنبيهات</div>':
    alerts.map(a=>`<div class="li" style="cursor:pointer" onclick="${a.animalId?`document.getElementById('bell-dd').style.display='none';openAnimal('${a.animalId}')`:''}">${a.animalId?'🧱':'💉'} <span style="font-size:12px">${a.txt}</span></div>`).join('');
}

function addAnimal(){
  const num=document.getElementById('nn').value.trim();
  const err=document.getElementById('ae');
  if(!num){err.textContent='أدخل الرقم';err.style.display='block';return;}
  if(db.animals.some(a=>a.number===num&&a.color===selColor)){err.textContent=`${num} (${selColor}) مستخدم`;err.style.display='block';return;}
  err.style.display='none';
  const penId=document.getElementById('np-sel').value||null;
  db.animals.push({id:uid(),number:num,color:selColor,cat:'m',gender:'أنثى',alive:true,twin:false,penId,entered:penId?new Date().toISOString():null,addedAt:new Date().toISOString(),notes:[]});
  save();toast('تمت الإضافة');document.getElementById('nn').value='';rHome();
}

function doSearch(){
  const num=document.getElementById('sn').value.trim();
  const color=document.getElementById('sc').value;
  const r=document.getElementById('sr');
  if(!num&&!color){r.innerHTML='';return;}
  const res=db.animals.filter(a=>a.alive&&(!num||a.number===num)&&(!color||a.color===color));
  r.innerHTML=res.length===0?'<div class="muted" style="font-size:12px">لا نتائج</div>':res.map(a=>`<div class="li" style="cursor:pointer" onclick="openAnimal('${a.id}')">${tbadge(a.number,a.color)}<span class="muted" style="font-size:11px">${a.cat==='m'?'أم':'مولود'}</span></div>`).join('');
}

function showCatMdl(title,ids,withPen){
  const list=db.animals.filter(a=>ids.includes(a.id));
  openMdl(`${title} (${list.length})`,list.length===0?'<div class="empty">لا توجد كائنات</div>':
    list.map(a=>{const pen=withPen?db.pens.find(p=>p.id===a.penId):null;return`<div class="li" style="cursor:pointer" onclick="closeMdl();openAnimal('${a.id}')">${tbadge(a.number,a.color)}<span class="muted" style="font-size:11px">${pen?pen.name:'بدون'}</span></div>`}).join(''));
}

function showDeadMdl(){
  const dead=db.animals.filter(a=>!a.alive);
  openMdl(`النفوق (${dead.length})`,`<button class="btn-r mb8 w100 jc" onclick="cfmResetDead()">🗑 تصفير</button>`+(dead.length===0?'<div class="empty">لا يوجد</div>':dead.map(a=>`<div class="li" style="cursor:pointer" onclick="closeMdl();openAnimal('${a.id}')">${tbadge(a.number,a.color)}<span class="red" style="font-size:11px">${a.deathCause||''}</span></div>`).join('')));
}
function cfmResetDead(){if(confirm('حذف سجل النفوق؟')){db.animals=db.animals.filter(a=>a.alive);save();toast('تم');closeMdl();rHome();}}

// ====== ANIMAL DETAIL ======
function openAnimal(id){curAnimal=id;rAnimal();}
function rAnimal(){
  const a=db.animals.find(x=>x.id===curAnimal);
  if(!a)return;
  const mother=a.motherId?db.animals.find(x=>x.id===a.motherId):null;
  const offs=db.animals.filter(x=>x.motherId===curAnimal);
  const pen=a.penId?db.pens.find(p=>p.id===a.penId):null;
  const anotes=a.notes||[];

  const offsHtml=a.cat==='m'?`<div class="card mt8"><div class="sh"><span class="st">المواليد (${offs.filter(o=>o.alive).length})</span><button class="btn" onclick="openOffs()">＋ إضافة</button></div>${offs.length===0?'<div class="empty">لا يوجد مواليد</div>':offs.map(o=>`<div class="li" style="cursor:pointer" onclick="openAnimal('${o.id}')">${tbadge(o.number,o.color)}<span class="muted" style="font-size:11px">${o.gender}${o.birthDate?' · '+fmt(o.birthDate):''}${!o.alive?' · نافق':''}</span></div>`).join('')}</div>`:'';

  const notesHtml=`<div class="card mt8"><div class="st mb8">📓 ملاحظات (${anotes.length})</div>${anotes.map((n,i)=>`<div class="db mb8 flex jb"><div><div style="font-size:13px">${n.text}</div><div class="muted" style="font-size:10px">${fmt(n.date)}</div></div><button class="bi red" onclick="delAnote(${i})">🗑</button></div>`).join('')}<div class="flex gap8 mt8"><input type="text" id="anote" placeholder="ملاحظة..." style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:10px;padding:8px 10px;font-size:13px;flex:1"><button class="btn" onclick="addAnote()">＋</button></div></div>`;

  openMdl(`#${a.number}`,`
    <div class="flex jb ac mb10">
      <div>${tbadge(a.number,a.color)}<div class="muted mt8" style="font-size:11px">${a.cat==='m'?'أم':'مولود'} · ${a.gender}</div>${mother?`<div class="muted" style="font-size:11px">الأم: #${mother.number}</div>`:''}${a.cat==='n'&&a.birthDate?`<div class="muted" style="font-size:11px">الميلاد: ${fmt(a.birthDate)}</div>`:''}${pen?`<div class="muted" style="font-size:11px">الحظيرة: ${pen.name}</div>`:''}${!a.alive&&a.deathCause?`<div class="red" style="font-size:11px">السبب: ${a.deathCause}</div>`:''}</div>
      <div class="flex" style="flex-direction:column;gap:4px;align-items:flex-end"><span class="chip ${a.alive?'cg':'cr'}">${a.alive?'حي':'نافق'}</span>${a.cat==='m'&&a.twin?'<span class="chip cau">متأومة</span>':''}</div>
    </div>
    <div class="fw gap8 mb8">
      ${a.alive?`<button class="btn-r" onclick="showDF()">💀 نفوق</button>`:`<button class="btn-g" onclick="undoDeath()">↩ إلغاء</button>`}
      <button class="btn-g" onclick="openSellA()">💰 بيع</button>
      <button class="btn-g" onclick="openTransfer()">🧱 ${pen?'نقل':'لحظيرة'}</button>
      ${a.cat==='n'&&a.gender==='أنثى'?`<button class="btn-g green" onclick="promote()">❤️ أم</button>`:''}
      <button class="btn-r" onclick="showDC()">🗑 حذف</button>
    </div>
    <div id="df" style="display:none" class="db mb8"><div class="fld"><label>سبب النفوق (اختياري)</label><textarea id="dcause"></textarea></div><div class="flex gap8"><button class="btn" style="background:#A8503A" onclick="cfmDeath()">تأكيد</button><button class="btn-g" onclick="document.getElementById('df').style.display='none'">إلغاء</button></div></div>
    <div id="dc" style="display:none" class="db"><div style="font-size:12px;text-align:center;margin-bottom:8px">حذف نهائي؟</div><div id="dc-offs"></div><div class="flex gap8"><button class="btn" style="background:#A8503A;flex:1;justify-content:center" onclick="doDelete()">تأكيد</button><button class="btn-g" style="flex:1;justify-content:center" onclick="document.getElementById('dc').style.display='none'">تراجع</button></div></div>
    ${offsHtml}${notesHtml}
  `,true);
}

function showDF(){document.getElementById('df').style.display='block';}
function cfmDeath(){
  const a=db.animals.find(x=>x.id===curAnimal);if(!a)return;
  a.alive=false;a.deathAt=new Date().toISOString();a.deathCause=document.getElementById('dcause').value||'';
  save();toast('تم تسجيل النفوق');closeMdl();rHome();
}
function undoDeath(){
  const a=db.animals.find(x=>x.id===curAnimal);if(!a)return;
  a.alive=true;delete a.deathAt;delete a.deathCause;
  save();toast('تم الإلغاء');rAnimal();rHome();
}
function promote(){
  const a=db.animals.find(x=>x.id===curAnimal);if(!a)return;
  a.cat='m';save();toast('تحويل لأم');rAnimal();rHome();
}
function showDC(){
  const offs=db.animals.filter(x=>x.motherId===curAnimal);
  const el=document.getElementById('dc-offs');
  el.innerHTML=offs.length?`<div class="db mb8"><div style="font-size:11px;font-weight:700;margin-bottom:6px">${offs.length} مولود لهذه الأم:</div><div class="fw gap8 mb8">${offs.map(o=>tbadge(o.number,o.color)).join('')}</div><label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer"><input type="checkbox" id="deloffs" style="width:18px;height:18px"> حذف المواليد أيضاً</label></div>`:'';
  document.getElementById('dc').style.display='block';
}
function doDelete(){
  const deloffs=document.getElementById('deloffs')&&document.getElementById('deloffs').checked;
  db.animals=db.animals.filter(a=>{if(a.id===curAnimal)return false;if(deloffs&&a.motherId===curAnimal)return false;return true;});
  if(!deloffs)db.animals.forEach(a=>{if(a.motherId===curAnimal)a.motherId=null;});
  save();toast('تم الحذف');closeMdl();rHome();
}
function addAnote(){
  const inp=document.getElementById('anote');if(!inp||!inp.value.trim())return;
  const a=db.animals.find(x=>x.id===curAnimal);if(!a)return;
  if(!a.notes)a.notes=[];
  a.notes.push({text:inp.value.trim(),date:tod()});
  save();toast('تمت الإضافة');rAnimal();
}
function delAnote(i){
  const a=db.animals.find(x=>x.id===curAnimal);if(!a)return;
  a.notes.splice(i,1);save();rAnimal();
}

// ====== SELL ======
function openSellA(){
  const a=db.animals.find(x=>x.id===curAnimal);
  openMdl(`بيع #${a.number}`,`<div class="db red mb8" style="font-size:11px">سيُحذف الكائن وتُسجَّل عملية بيع.</div><div class="fld"><label>المبلغ (اختياري)</label><input type="number" id="sa"></div><div class="fld"><label>الوصف</label><input type="text" id="sd" placeholder="بيع..."></div><div class="fld"><label>التاريخ</label><input type="date" id="sdate" value="${tod()}"></div><button class="btn w100 jc" style="background:#4472A8" onclick="doSell()">تأكيد البيع</button>`);
}
function doSell(){
  const a=db.animals.find(x=>x.id===curAnimal);if(!a)return;
  db.sales.push({id:uid(),desc:document.getElementById('sd').value||`بيع #${a.number}`,amount:document.getElementById('sa').value||0,date:document.getElementById('sdate').value||tod()});
  db.animals=db.animals.filter(x=>x.id!==curAnimal);
  save();toast('تم البيع');closeMdl();rHome();
}

// ====== TRANSFER ======
function openTransfer(){
  const a=db.animals.find(x=>x.id===curAnimal);
  const others=db.pens.filter(p=>p.id!==a.penId);
  openMdl(`نقل #${a.number}`,`${a.penId?`<button class="btn-r mb8 w100 jc" onclick="removeFromPen('${curAnimal}')">🚪 إخراج من الحظيرة</button>`:''}${others.length===0?'<div class="empty">لا توجد حظائر أخرى</div>':others.map(p=>`<div class="li" style="cursor:pointer" onclick="doTransfer('${curAnimal}','${p.id}')"><span style="font-weight:700">${p.name}</span><span class="muted" style="font-size:11px">${p.alert!==false?`تنبيه ${p.days}y`:'بلا تنبيه'}</span></div>`).join('')}`);
}
function doTransfer(aid,pid){const a=db.animals.find(x=>x.id===aid);if(a){a.penId=pid;a.entered=new Date().toISOString();}save();toast('تم النقل');closeMdl();rHome();}
function removeFromPen(id){const a=db.animals.find(x=>x.id===id);if(a){a.penId=null;a.entered=null;}save();toast('تم الإخراج');closeMdl();rHome();}

// ====== OFFSPRING ======
let offRows=[{gender:'أنثى',number:'',color:COLORS[0].v}];
function openOffs(){offRows=[{gender:'أنثى',number:'',color:COLORS[0].v}];rOffs();}
function rOffs(){
  const a=db.animals.find(x=>x.id===curAnimal);
  openMdl(`مواليد #${a.number}`,`
    <div class="fld"><label>تاريخ الميلاد</label><input type="date" id="obd" value="${tod()}"></div>
    <div id="orows">${offRows.map((r,i)=>`<div style="border:1px solid #E1D6BB;border-radius:12px;padding:11px;margin-bottom:9px"><div class="muted mb8" style="font-size:11px;font-weight:700">مولود ${i+1}</div><div class="flex gap8 mb8"><select onchange="offRows[${i}].gender=this.value" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:7px;flex:1;font-size:12px"><option ${r.gender==='أنثى'?'selected':''}>أنثى</option><option ${r.gender==='ذكر'?'selected':''}>ذكر</option></select><input type="text" placeholder="الرقم" value="${r.number}" oninput="offRows[${i}].number=this.value" style="background:#F3ECDD;border:1px solid #E1D6BB;border-radius:8px;padding:7px;flex:1;font-size:12px"></div><div class="cp" id="ocp${i}"></div></div>`).join('')}</div>
    ${offRows.length<3?`<button class="btn-g mb8" onclick="addOffRow()">＋ مولود آخر</button>`:''}
    <div id="oerr" class="red mb8" style="font-size:12px;display:none"></div>
    <button class="btn w100 jc" onclick="saveOffs()">حفظ</button>
  `,true);
  offRows.forEach((r,i)=>mkCP('ocp'+i,r.color,c=>offRows[i].color=c));
}
function addOffRow(){if(offRows.length>=3)return;offRows.push({gender:'أنثى',number:'',color:COLORS[0].v});rOffs();}
function saveOffs(){
  const bd=document.getElementById('obd').value||tod();
  const rows=offRows.map(r=>({...r,number:r.number.trim(),bd}));
  const err=document.getElementById('oerr');
  for(const r of rows){
    if(!r.number){err.textContent='أدخل رقم';err.style.display='block';return;}
    if(db.animals.some(a=>a.number===r.number&&a.color===r.color)){err.textContent=`${r.number}(${r.color}) مستخدم`;err.style.display='block';return;}
  }
  const mid=curAnimal;
  rows.forEach(r=>db.animals.push({id:uid(),number:r.number,color:r.color,cat:'n',gender:r.gender,alive:true,twin:false,birthDate:r.bd,penId:null,entered:null,motherId:mid,addedAt:new Date().toISOString(),notes:[]}));
  const tot=db.animals.filter(a=>a.motherId===mid).length;
  const m=db.animals.find(a=>a.id===mid);
  if(m){
    if(tot>=2){m.twin=true;if(!db.bc.t.includes(mid)){db.bc.t.push(mid);db.bc.s=db.bc.s.filter(x=>x!==mid);}}
    else if(!db.bc.t.includes(mid)&&!db.bc.s.includes(mid))db.bc.s.push(mid);
  }
  save();toast('تمت الإضافة');closeMdl();rAnimal();rHome();
}

// ====== PENS ======
let pvPen=null,pvSel=[],pvMode=false;
function rPens(){
  const el=document.getElementById('pens-list');
  if(!db.pens.length){el.innerHTML='<div class="empty">لا توجد حظائر</div>';return;}
  el.innerHTML=db.pens.map(p=>{
    const inn=db.animals.filter(a=>a.penId===p.id&&a.alive);
    return`<div class="card" style="cursor:pointer" onclick="openPV('${p.id}')"><div class="flex jb ac"><div><div style="font-weight:700;font-size:14px">${p.name}</div><div class="muted" style="font-size:11px">${inn.length} كائن · ${p.alert!==false?`تنبيه ${p.days} يوم`:'بلا تنبيه'}</div></div><div class="flex gap8" onclick="event.stopPropagation()"><button class="bi" onclick="openEditPen('${p.id}')">✎</button><button class="btn-g" onclick="openAddToPen('${p.id}')">＋</button></div></div></div>`;
  }).join('');
}

function openPV(pid){pvPen=pid;pvMode=false;pvSel=[];rPV();}
function rPV(){
  const pen=db.pens.find(p=>p.id===pvPen);
  const anims=db.animals.filter(a=>a.penId===pvPen&&a.alive);
  openMdl(`${pen.name} (${anims.length})`,`
    <div class="flex jb mb8"><button class="btn-g" onclick="togPVSel()">${pvMode?'إلغاء':'✓ تحديد'}</button></div>
    <div id="pvlist">${anims.length===0?'<div class="empty">لا كائنات</div>':anims.map(a=>{const ck=pvSel.includes(a.id);return`<div class="li" style="cursor:pointer;background:${ck?'#6E7B4514':'#F3ECDD'};border-color:${ck?'#6E7B45':'#E1D6BB'}" onclick="${pvMode?`togPVA('${a.id}')`:``}"><div class="flex ac gap8">${pvMode?`<div style="width:18px;height:18px;border:2px solid ${ck?'#6E7B45':'#ccc'};border-radius:4px;background:${ck?'#6E7B45':'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px">${ck?'✓':''}</div>`:''}${pvMode?tbadge(a.number,a.color):`<span onclick="closeMdl();openAnimal('${a.id}')">${tbadge(a.number,a.color)}</span>`}</div>${!pvMode?`<button class="bi" onclick="event.stopPropagation();rmPVA('${a.id}')">🚪</button>`:''}</div>`;}).join('')}</div>
    ${pvMode&&anims.length?`<div class="flex gap8 mt8"><button class="btn" style="flex:1;justify-content:center" onclick="bulkTr()" ${!pvSel.length?'disabled':''}>نقل (${pvSel.length})</button><button class="btn-r" style="flex:1;justify-content:center" onclick="bulkDel()" ${!pvSel.length?'disabled':''}>🗑 (${pvSel.length})</button></div>`:''}
  `);
}
function togPVSel(){pvMode=!pvMode;pvSel=[];rPV();}
function togPVA(id){pvSel=pvSel.includes(id)?pvSel.filter(x=>x!==id):[...pvSel,id];rPV();}
function rmPVA(id){const a=db.animals.find(x=>x.id===id);if(a){a.penId=null;a.entered=null;}save();rPV();rPens();}
function bulkTr(){
  const others=db.pens.filter(p=>p.id!==pvPen);
  if(!others.length){toast('لا حظائر أخرى',true);return;}
  openMdl(`نقل ${pvSel.length} إلى...`,others.map(p=>`<div class="li" style="cursor:pointer" onclick="doBTr('${p.id}')"><span style="font-weight:700">${p.name}</span></div>`).join(''));
}
function doBTr(pid){pvSel.forEach(id=>{const a=db.animals.find(x=>x.id===id);if(a){a.penId=pid;a.entered=new Date().toISOString();}});save();toast(`تم نقل ${pvSel.length}`);closeMdl();rPens();}
function bulkDel(){
  if(!confirm(`حذف ${pvSel.length} كائن؟`))return;
  const offs=db.animals.filter(a=>pvSel.includes(a.motherId));
  let delO=false;if(offs.length)delO=confirm('هناك مواليد — حذفهم أيضاً؟');
  db.animals=db.animals.filter(a=>!pvSel.includes(a.id)&&!(delO&&pvSel.includes(a.motherId)));
  save();toast('تم الحذف');closeMdl();rPens();
}

function openAddPen(){
  openMdl('إضافة حظيرة',`<div class="fld"><label>الاسم</label><input type="text" id="pn" placeholder="حظيرة ١"></div><div class="fld"><label>تنبيه بعد كم يوم</label><input type="number" id="pd" value="7"></div><div class="flex jb ac mb10" style="background:#F3ECDD;border-radius:10px;padding:10px"><span style="font-size:13px">تفعيل التنبيه</span><input type="checkbox" id="pa" checked style="width:20px;height:20px"></div><button class="btn w100 jc" onclick="savePen()">حفظ</button>`);
}
function savePen(){
  const name=document.getElementById('pn').value.trim();
  if(!name){toast('أدخل الاسم',true);return;}
  db.pens.push({id:uid(),name,days:Number(document.getElementById('pd').value)||7,alert:document.getElementById('pa').checked});
  save();toast('تمت الإضافة');closeMdl();rPens();rHome();
}
function openEditPen(id){
  const p=db.pens.find(x=>x.id===id);
  openMdl('تعديل الحظيرة',`<div class="fld"><label>الاسم</label><input type="text" id="epn" value="${p.name}"></div><div class="fld"><label>الأيام</label><input type="number" id="epd" value="${p.days||7}"></div><div class="flex jb ac mb10" style="background:#F3ECDD;border-radius:10px;padding:10px"><span style="font-size:13px">تفعيل التنبيه</span><input type="checkbox" id="epa" ${p.alert!==false?'checked':''} style="width:20px;height:20px"></div><button class="btn w100 jc mb8" onclick="doEditPen('${id}')">حفظ</button><button class="btn-r w100 jc" onclick="delPen('${id}')">🗑 حذف</button>`);
}
function doEditPen(id){
  const p=db.pens.find(x=>x.id===id);if(!p)return;
  const n=document.getElementById('epn').value.trim();if(!n){toast('أدخل الاسم',true);return;}
  p.name=n;p.days=Number(document.getElementById('epd').value)||7;p.alert=document.getElementById('epa').checked;
  save();toast('تم الحفظ');closeMdl();rPens();
}
function delPen(id){
  if(confirm('حذف الحظيرة؟')){db.animals.forEach(a=>{if(a.penId===id){a.penId=null;a.entered=null;}});db.pens=db.pens.filter(p=>p.id!==id);save();toast('تم');closeMdl();rPens();}
}
let atpSel=[];
function openAddToPen(pid){
  atpSel=[];
  const free=db.animals.filter(a=>a.alive&&!a.penId);
  openMdl('إضافة للحظيرة',`${free.length===0?'<div class="empty">لا كائنات حرة</div>':free.map(a=>`<div class="li" style="cursor:pointer" id="atp${a.id}" onclick="togATP('${a.id}','${pid}',this)"><div class="flex ac gap8"><div style="width:18px;height:18px;border:2px solid #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px" id="atpb${a.id}"></div>${tbadge(a.number,a.color)}</div><span class="muted" style="font-size:11px">${a.cat==='m'?'أم':'مولود'}</span></div>`).join('')}${free.length?`<button class="btn w100 jc mt8" onclick="saveATP('${pid}')">إضافة</button>`:''}`);
}
function togATP(id,pid,el){
  const b=document.getElementById('atpb'+id);
  if(atpSel.includes(id)){atpSel=atpSel.filter(x=>x!==id);b.style.background='transparent';b.style.borderColor='#ccc';b.textContent='';el.style.background='#F3ECDD';el.style.borderColor='#E1D6BB';}
  else{atpSel.push(id);b.style.background='#6E7B45';b.style.borderColor='#6E7B45';b.style.color='#fff';b.textContent='✓';el.style.background='#6E7B4514';el.style.borderColor='#6E7B45';}
}
function saveATP(pid){
  if(!atpSel.length){toast('اختر كائن',true);return;}
  atpSel.forEach(id=>{const a=db.animals.find(x=>x.id===id);if(a){a.penId=pid;a.entered=new Date().toISOString();}});
  atpSel=[];save();toast('تمت الإضافة');closeMdl();rPens();rHome();
}

// ====== FINANCE ======
function rFin(){
  const from=document.getElementById('ff').value,to=document.getElementById('ft').value;
  const cat=document.getElementById('ecf').value,ss=document.getElementById('ssrch').value.trim().toLowerCase();
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const fE=db.expenses.filter(e=>inR(e.date)&&(!cat||e.category===cat));
  const fS=db.sales.filter(s=>inR(s.date)&&(!ss||(s.desc||'').toLowerCase().includes(ss)));
  const tE=fE.reduce((a,b)=>a+Number(b.amount||0),0);
  const tS=fS.reduce((a,b)=>a+Number(b.amount||0),0);
  const net=tS-tE;
  document.getElementById('fnet').textContent=net.toLocaleString()+' ﷼';
  document.getElementById('fnet').style.color=net>=0?'#6E7B45':'#A8503A';
  document.getElementById('ftotals').innerHTML=`<div class="sc"><div class="v green">${tS.toLocaleString()}</div><div class="l">مبيعات ﷼</div></div><div class="sc"><div class="v red">${tE.toLocaleString()}</div><div class="l">مصروفات ﷼</div></div>`;
  document.getElementById('exp-list').innerHTML=fE.length===0?'<div class="empty">لا مصروفات</div>':[...fE].reverse().map(e=>`<div class="li"><div><div style="font-size:12.5px;font-weight:600">${e.desc||e.category}</div><div class="muted" style="font-size:10px">${e.category} · ${fmt(e.date)}</div></div><div class="flex ac gap8"><span class="red" style="font-weight:700;font-size:12px">-${Number(e.amount||0).toLocaleString()}</span><button class="bi red" onclick="delE('${e.id}')">🗑</button></div></div>`).join('');
  document.getElementById('sal-list').innerHTML=fS.length===0?'<div class="empty">لا مبيعات</div>':[...fS].reverse().map(s=>`<div class="li"><div><div style="font-size:12.5px;font-weight:600">${s.desc||'بيع'}</div><div class="muted" style="font-size:10px">${fmt(s.date)}</div></div><div class="flex ac gap8"><span class="green" style="font-weight:700;font-size:12px">+${Number(s.amount||0).toLocaleString()}</span><button class="bi red" onclick="delS('${s.id}')">🗑</button></div></div>`).join('');
}
function delE(id){db.expenses=db.expenses.filter(e=>e.id!==id);save();rFin();}
function delS(id){db.sales=db.sales.filter(s=>s.id!==id);save();rFin();}
function cfmResetFin(){if(confirm('تصفير المالية؟')){db.expenses=[];db.sales=[];save();toast('تم');rFin();}}
function openExpModal(){
  openMdl('إضافة مصروف',`<div class="fld"><label>النوع</label><select id="ecat">${ECATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fld"><label>الوصف</label><input type="text" id="edesc"></div><div class="flex gap8"><div class="fld" style="flex:1"><label>المبلغ</label><input type="number" id="eamt"></div><div class="fld" style="flex:1"><label>التاريخ</label><input type="date" id="edate" value="${tod()}"></div></div><button class="btn w100 jc" onclick="saveExp()">حفظ</button>`);
}
function saveExp(){const a=document.getElementById('eamt').value;if(!a){toast('أدخل المبلغ',true);return;}db.expenses.push({id:uid(),category:document.getElementById('ecat').value,desc:document.getElementById('edesc').value,amount:a,date:document.getElementById('edate').value||tod()});save();toast('تمت الإضافة');closeMdl();rFin();}
function openSaleModal(){
  openMdl('إضافة مبيعة',`<div class="fld"><label>الوصف</label><input type="text" id="sdesc"></div><div class="flex gap8"><div class="fld" style="flex:1"><label>المبلغ</label><input type="number" id="samt"></div><div class="fld" style="flex:1"><label>التاريخ</label><input type="date" id="sdate" value="${tod()}"></div></div><button class="btn w100 jc" onclick="saveSl()">حفظ</button>`);
}
function saveSl(){const a=document.getElementById('samt').value;if(!a){toast('أدخل المبلغ',true);return;}db.sales.push({id:uid(),desc:document.getElementById('sdesc').value,amount:a,date:document.getElementById('sdate').value||tod()});save();toast('تمت الإضافة');closeMdl();rFin();}

// ====== NOTES ======
function openNotes(){
  openMdl(`الملاحظات (${db.notes.length})`,`
    <div class="card mb8" style="background:#F3ECDD;border:none">
      <div class="flex gap8 mb8">
        <select id="ntype" style="background:#fff;border:1px solid #E1D6BB;border-radius:8px;padding:7px;font-size:12px;flex:1"><option>مرض</option><option>مشكلة</option></select>
        <input type="date" id="ndate" value="${tod()}" style="background:#fff;border:1px solid #E1D6BB;border-radius:8px;padding:7px;font-size:12px;flex:1">
      </div>
      <div class="fld"><label>العنوان</label><input type="text" id="ntitle"></div>
      <div class="fld"><label>التفاصيل</label><textarea id="ndetails"></textarea></div>
      <div class="fld"><label>العلاج / الحل</label><textarea id="ntreat"></textarea></div>
      <button class="btn w100 jc" onclick="saveNote()">＋ إضافة</button>
    </div>
    ${db.notes.length===0?'<div class="empty">لا ملاحظات</div>':db.notes.slice().reverse().map((n,ri)=>{const i=db.notes.length-1-ri;return`<div class="card mb8"><div class="flex jb ac mb8"><div class="flex ac gap8"><span class="chip ${n.type==='مرض'?'cr':'cau'}">${n.type}</span><span style="font-weight:700;font-size:12.5px">${n.title}</span></div><button class="bi red" onclick="delNote(${i})">🗑</button></div><div class="muted" style="font-size:10px;margin-bottom:4px">${fmt(n.date)}</div>${n.details?`<div style="font-size:12px;margin-bottom:3px"><b class="muted">${n.type==='مرض'?'الأعراض:':'التفاصيل:'}</b> ${n.details}</div>`:''}${n.treatment?`<div style="font-size:12px"><b class="muted">${n.type==='مرض'?'العلاج:':'الحل:'}</b> ${n.treatment}</div>`:''}</div>`;}).join('')}
  `);
}
function saveNote(){const t=document.getElementById('ntitle').value.trim();if(!t){toast('أدخل العنوان',true);return;}db.notes.push({id:uid(),type:document.getElementById('ntype').value,title:t,details:document.getElementById('ndetails').value,treatment:document.getElementById('ntreat').value,date:document.getElementById('ndate').value||tod()});save();toast('تمت الإضافة');openNotes();rHome();}
function delNote(i){db.notes.splice(i,1);save();openNotes();rHome();}

// ====== VAX REMINDERS ======
function openVax(){
  openMdl(`مواعيد التطعيم (${db.vax.length})`,`
    <div class="card mb8" style="background:#F3ECDD;border:none">
      <div class="fld"><label>نوع التطعيم</label><input type="text" id="vtype" placeholder="مثال: حمى قلاعية"></div>
      <div class="flex gap8">
        <div class="fld" style="flex:1"><label>التاريخ</label><input type="date" id="vdate" value="${tod()}"></div>
        <div class="fld" style="flex:1"><label>تنبيه قبل كم يوم</label><input type="number" id="vbef" value="0"></div>
      </div>
      <div class="fld"><label>ملاحظات (اختياري)</label><textarea id="vnotes"></textarea></div>
      <div id="verr" class="red mb8" style="font-size:11px;display:none"></div>
      <button class="btn w100 jc" onclick="saveVax()">＋ إضافة</button>
    </div>
    ${db.vax.length===0?'<div class="empty">لا مواعيد</div>':db.vax.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(v=>`
      <div class="card mb8" style="border-color:${new Date(v.date)<=new Date()?'#A8503A55':'#E1D6BB'}">
        <div class="flex jb ac mb4">
          <span style="font-weight:600;font-size:13px">${v.type}</span>
          <div class="flex gap4"><button class="bi" onclick="openEV('${v.id}')">✎</button><button class="bi red" onclick="delVax('${v.id}')">🗑</button></div>
        </div>
        <div class="muted" style="font-size:10px">${fmt(v.date)}${new Date(v.date)<=new Date()?' · مستحق':''}${v.before?` · تنبيه قبل ${v.before} يوم`:''}</div>
        ${v.notes?`<div style="font-size:11px;margin-top:3px">${v.notes}</div>`:''}
      </div>
    `).join('')}
  `);
}
function saveVax(){const t=document.getElementById('vtype').value.trim();const e=document.getElementById('verr');if(!t){e.textContent='أدخل النوع';e.style.display='block';return;}e.style.display='none';db.vax.push({id:uid(),type:t,date:document.getElementById('vdate').value||tod(),before:Number(document.getElementById('vbef').value)||0,notes:document.getElementById('vnotes').value});save();toast('تمت الإضافة');openVax();rHome();}
function delVax(id){db.vax=db.vax.filter(v=>v.id!==id);save();openVax();rHome();}
function openEV(id){
  const v=db.vax.find(x=>x.id===id);if(!v)return;
  openMdl('تعديل',`<div class="fld"><label>النوع</label><input type="text" id="evt" value="${v.type}"></div><div class="flex gap8"><div class="fld" style="flex:1"><label>التاريخ</label><input type="date" id="evd" value="${v.date||tod()}"></div><div class="fld" style="flex:1"><label>قبل كم يوم</label><input type="number" id="evb" value="${v.before||0}"></div></div><div class="fld"><label>ملاحظات</label><textarea id="evn">${v.notes||''}</textarea></div><button class="btn w100 jc" onclick="saveEV('${id}')">حفظ</button>`);
}
function saveEV(id){const v=db.vax.find(x=>x.id===id);if(!v)return;v.type=document.getElementById('evt').value.trim()||v.type;v.date=document.getElementById('evd').value||v.date;v.before=Number(document.getElementById('evb').value)||0;v.notes=document.getElementById('evn').value;save();toast('تم');openVax();}

// ====== REPORTS ======
function rRep(){
  const from=document.getElementById('rf').value,to=document.getElementById('rt').value;
  const cat=document.getElementById('rcat').value;
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const fE=db.expenses.filter(e=>inR(e.date)),fS=db.sales.filter(s=>inR(s.date));
  const tE=fE.reduce((a,b)=>a+Number(b.amount||0),0),tS=fS.reduce((a,b)=>a+Number(b.amount||0),0);
  document.getElementById('rtotals').innerHTML=`<div class="sc"><div class="v" style="color:${tS-tE>=0?'#6E7B45':'#A8503A'}">${(tS-tE).toLocaleString()}</div><div class="l">صافي ﷼</div></div><div class="sc"><div class="v green">${tS.toLocaleString()}</div><div class="l">مبيعات ﷼</div></div><div class="sc"><div class="v red">${tE.toLocaleString()}</div><div class="l">مصروفات ﷼</div></div>`;
  const bc=db.bc;
  document.getElementById('rbc').innerHTML=`<div class="sc"><div class="v gold">${bc.t.length}</div><div class="l">متأومة</div></div><div class="sc"><div class="v" style="color:#4472A8">${bc.s.length}</div><div class="l">غير متأومة</div></div>`;
  const A=db.animals;
  const mothers=A.filter(a=>a.cat==='m'&&a.alive);
  const nR=A.filter(a=>a.cat==='n'&&a.alive&&a.addedAt&&inR(a.addedAt.slice(0,10)));
  const dR=A.filter(a=>!a.alive&&a.deathAt&&inR(a.deathAt.slice(0,10)));
  const prod=mothers.filter(m=>A.some(o=>o.motherId===m.id&&o.cat==='n'));
  const pPct=mothers.length?Math.round(prod.length/mothers.length*100):0;
  const twin=mothers.filter(m=>m.twin);
  const tPct=prod.length?Math.round(twin.length/prod.length*100):0;
  document.getElementById('rherd').innerHTML=`<div class="sc"><div class="v" style="color:#4472A8">${nR.length}</div><div class="l">مواليد جدد</div></div><div class="sc"><div class="v red">${dR.length}</div><div class="l">نفوق</div></div><div class="sc"><div class="v green">${pPct}%</div><div class="l">نسبة الأمهات المنتجة</div></div><div class="sc"><div class="v gold">${twin.length}</div><div class="l">الأمهات المتأومة (${tPct}%)</div></div>`;
  if(cat){
    const cE=fE.filter(e=>e.category===cat);
    const cT=cE.reduce((a,b)=>a+Number(b.amount||0),0);
    document.getElementById('rcatr').innerHTML=`<div class="sc mb8"><div class="v red">${cT.toLocaleString()}</div><div class="l">${cat} ﷼</div><div class="s muted">${cE.length} عملية</div></div>${cE.map(e=>`<div class="li"><span style="font-size:12px">${e.desc||e.category}</span><span class="red" style="font-size:11px">${Number(e.amount||0).toLocaleString()} · ${fmt(e.date)}</span></div>`).join('')}`;
  }else document.getElementById('rcatr').innerHTML='';
  const mk=d=>d.slice(0,7);
  const months=[...new Set([...fE,...fS].map(x=>mk(x.date)))].sort();
  const maxM=Math.max(1,...months.map(m=>{const ms=fS.filter(s=>mk(s.date)===m).reduce((a,b)=>a+Number(b.amount||0),0);const me=fE.filter(e=>mk(e.date)===m).reduce((a,b)=>a+Number(b.amount||0),0);return Math.max(ms,me);}));
  document.getElementById('rmonth').innerHTML=months.length===0?'<div class="muted" style="font-size:12px">لا بيانات</div>':months.map(m=>{
    const ms=fS.filter(s=>mk(s.date)===m).reduce((a,b)=>a+Number(b.amount||0),0);
    const me=fE.filter(e=>mk(e.date)===m).reduce((a,b)=>a+Number(b.amount||0),0);
    return`<div class="mb8"><div class="muted" style="font-size:11px;margin-bottom:3px">${m}</div><div style="font-size:10px" class="green">مبيعات ${ms.toLocaleString()}</div><div class="bar"><div class="bf" style="width:${Math.round(ms/maxM*100)}%;background:#6E7B45"></div></div><div style="font-size:10px;margin-top:5px" class="red">مصروفات ${me.toLocaleString()}</div><div class="bar"><div class="bf" style="width:${Math.round(me/maxM*100)}%;background:#A8503A"></div></div></div>`;
  }).join('');
  const vax=db.vax.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById('rvax').innerHTML=vax.length===0?'<div class="muted" style="font-size:12px">لا مواعيد</div>':vax.map(v=>`<div class="li mb8"><div><div style="font-size:12.5px;font-weight:600">${v.type}</div>${v.notes?`<div style="font-size:10px;color:#8C8064">${v.notes}</div>`:''}</div><span style="font-size:11px;color:${new Date(v.date)<=new Date()?'#A8503A':'#8C8064'}">${fmt(v.date)}${new Date(v.date)<=new Date()?' · مستحق':''}</span></div>`).join('');
  document.getElementById('rpens').innerHTML=db.pens.length===0?'<div class="muted" style="font-size:12px">لا حظائر</div>':db.pens.map(p=>{const l=A.filter(a=>a.penId===p.id&&a.alive);const avg=l.length?Math.round(l.reduce((a,an)=>a+Math.floor((new Date()-new Date(an.entered))/86400000),0)/l.length):0;return`<div class="li mb8"><span style="font-weight:700">${p.name}</span><span class="muted" style="font-size:11px">${l.length} كائن · ${avg} يوم</span></div>`;}).join('');
}
function cfmResetBC(){if(confirm('تصفير العداد؟')){db.bc={t:[],s:[]};save();toast('تم');rRep();}}

// ====== MODAL ======
let keepOpen=false;
function openMdl(title,body,ko){
  keepOpen=!!ko;
  document.getElementById('mbox').innerHTML=`<div class="mh"><h3>${title}</h3><button class="bi" onclick="closeMdl()" style="font-size:18px">✕</button></div>${body}`;
  document.getElementById('ovl').classList.add('open');
}
function closeMdl(){document.getElementById('ovl').classList.remove('open');curAnimal=null;atpSel=[];pvSel=[];}

rHome();
</script>
